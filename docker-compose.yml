# Local stack: MySQL + Keycloak + IAM + media + employee + gateway. Secrets come from .env (copy .env.example; .env is gitignored).
# Build the jars first: mvn -DskipTests package
name: hrm

services:
  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      IAM_DB_USERNAME: ${IAM_DB_USERNAME:?set in .env}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:?set in .env}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?set in .env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
      MEDIA_DB_USERNAME: ${MEDIA_DB_USERNAME:-hrm_media}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?set in .env}
      EMPLOYEE_DB_USERNAME: ${EMPLOYEE_DB_USERNAME:-hrm_employee}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD:?set in .env}
    ports:
      - "3316:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Tokens always carry this issuer, whether Keycloak is reached from the browser or from inside the network.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Read by the realm import placeholders in hrm-realm.json.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set in .env}
      HRM_SUPERADMIN_INITIAL_PASSWORD: ${HRM_SUPERADMIN_INITIAL_PASSWORD:?set in .env}
    ports:
      - "8180:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # The image has no curl; probe the management port with bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  iam-service:
    build: ./services/iam-service
    environment:
      IAM_DB_URL: jdbc:mysql://mysql:3306/hrm_iam?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      IAM_DB_USERNAME: ${IAM_DB_USERNAME}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/hrm
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      # First company admin (optional; both empty = skip). See BootstrapAdminRunner.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Account shown to companies paying plan orders by bank transfer.
      SAAS_BANK_NAME: ${SAAS_BANK_NAME:-}
      SAAS_BANK_ACCOUNT_NUMBER: ${SAAS_BANK_ACCOUNT_NUMBER:-}
      SAAS_BANK_ACCOUNT_NAME: ${SAAS_BANK_ACCOUNT_NAME:-}
      # Encryption key for secrets saved in platform settings (base64, 32 bytes). Optional.
      HRM_SETTINGS_ENC_KEY: ${HRM_SETTINGS_ENC_KEY:-}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  media-service:
    build: ./services/media-service
    environment:
      MEDIA_DB_URL: jdbc:mysql://mysql:3306/hrm_media?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MEDIA_DB_USERNAME: ${MEDIA_DB_USERNAME:-hrm_media}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD}
      # HMAC key of the time-limited file links (>= 32 chars).
      MEDIA_LINK_SECRET: ${MEDIA_LINK_SECRET:?set in .env}
      MEDIA_STORAGE_DIR: /data/media
      MEDIA_PUBLIC_BASE_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/hrm
      IAM_SERVICE_URL: http://iam-service:8081
    ports:
      - "8082:8082"
    volumes:
      - media-data:/data/media
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  employee-service:
    build: ./services/employee-service
    environment:
      EMPLOYEE_DB_URL: jdbc:mysql://mysql:3306/hrm_employee?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      EMPLOYEE_DB_USERNAME: ${EMPLOYEE_DB_USERNAME:-hrm_employee}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD}
      # AES key of bank account number / tax payer id: openssl rand -base64 32
      EMPLOYEE_ENC_KEY: ${EMPLOYEE_ENC_KEY:?set in .env}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/hrm
      IAM_SERVICE_URL: http://iam-service:8081
      MEDIA_SERVICE_URL: http://media-service:8082
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  gateway-server:
    build: ./services/gateway-server
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/hrm
      IAM_SERVICE_URL: http://iam-service:8081
      MEDIA_SERVICE_URL: http://media-service:8082
      EMPLOYEE_SERVICE_URL: http://employee-service:8083
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  mysql-data:
  media-data:
