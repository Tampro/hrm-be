server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway-server
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:hrm}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/hrm}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins: ${HRM_CORS_ORIGINS:http://localhost:5173}
                allowed-methods: GET,POST,PUT,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,Accept-Language
                exposed-headers: X-Trace-Id
          # Each service sets its own CORS headers too; keep only the gateway's.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          httpclient:
            connect-timeout: 3000
            response-timeout: 15s
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/me/**,/api/v1/me,/api/v1/iam/**,/api/v1/saas/**,/api/v1/settings/**
            - id: media-service
              uri: ${MEDIA_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/media/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
